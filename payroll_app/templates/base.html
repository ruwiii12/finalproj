{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Shemu Payroll</title>
    <link rel="stylesheet" href="{% static 'bootstrap/css/bootstrap.min.css' %}">
    <style>
        :root {
            --navy: #1a2540;
            --gold: #f3c444;
            --gold-light: #e8c97a;
            --cream: #f9f6f0;
            --card-bg: #ffffff;
        }

        body {
            background-color: var(--cream);
            font-family: 'Georgia', serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        /* NAVBAR */
        .navbar-shemu {
            background-color: var(--navy);
            border-bottom: 3px solid var(--gold);
            padding: 0.75rem 2rem;
        }

        .navbar-brand-shemu {
            font-size: 1.6rem;
            font-weight: bold;
            color: var(--gold) !important;
            letter-spacing: 0.12em;
            text-decoration: none;
            line-height: 1.1;
        }

        .navbar-brand-shemu small {
            color: #c8d0e0;
            font-weight: normal;
            font-size: 0.65rem;
            letter-spacing: 0.25em;
            display: block;
        }

        .nav-link-shemu {
            color: #c8d0e0 !important;
            font-size: 0.88rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            padding: 0.45rem 1rem !important;
            border-radius: 3px;
            transition: color 0.2s, background 0.2s;
            text-decoration: none;
        }

        .nav-link-shemu:hover,
        .nav-link-shemu.active {
            color: var(--gold) !important;
            background: rgba(201, 168, 76, 0.1);
        }

        /* MAIN */
        .main-content {
            flex: 1;
            padding: 2.5rem 2rem;
        }

        .page-title {
            font-size: 1.9rem;
            color: var(--navy);
            font-weight: bold;
            letter-spacing: 0.04em;
            margin-bottom: 1.5rem;
            border-bottom: 2px solid var(--gold);
            padding-bottom: 0.4rem;
            display: inline-block;
        }

        /* TABLE */
        .shemu-table {
            background: var(--card-bg);
            border-radius: 6px;
            overflow: hidden;
            box-shadow: 0 2px 12px rgba(26,37,64,0.09);
        }

        .shemu-table thead {
            background-color: var(--navy);
            color: var(--gold);
            font-size: 0.85rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
        }

        .shemu-table thead th {
            padding: 0.9rem 1rem;
            font-weight: normal;
            border: none;
        }

        .shemu-table tbody tr {
            border-bottom: 1px solid #eee;
            transition: background 0.15s;
        }

        .shemu-table tbody tr:hover { background: #f5f0e8; }

        .shemu-table tbody td {
            padding: 0.8rem 1rem;
            vertical-align: middle;
            color: #2c3e50;
            font-size: 0.95rem;
        }

        /* BUTTONS */
        .btn-shemu-primary {
            background-color: var(--navy);
            color: var(--gold);
            border: 1px solid var(--navy);
            border-radius: 3px;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            padding: 0.3rem 0.8rem;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            transition: background 0.2s, color 0.2s;
        }
        .btn-shemu-primary:hover {
            background-color: var(--gold);
            color: var(--navy);
        }

        .btn-shemu-gold {
            background-color: var(--gold);
            color: var(--navy);
            border: 1px solid var(--gold);
            border-radius: 3px;
            font-size: 0.8rem;
            letter-spacing: 0.05em;
            padding: 0.3rem 0.8rem;
            font-weight: bold;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-shemu-gold:hover { background-color: var(--gold-light); color: var(--navy); }

        .btn-shemu-danger {
            background-color: #c0392b;
            color: #fff;
            border: 1px solid #c0392b;
            border-radius: 3px;
            font-size: 0.8rem;
            padding: 0.3rem 0.8rem;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-shemu-danger:hover { background-color: #a93226; }

        .btn-shemu-success {
            background-color: #1e6f3e;
            color: #fff;
            border: 1px solid #1e6f3e;
            border-radius: 3px;
            font-size: 0.8rem;
            padding: 0.3rem 0.8rem;
            text-decoration: none;
            display: inline-block;
            cursor: pointer;
            transition: background 0.2s;
        }
        .btn-shemu-success:hover { background-color: #165c33; }

        /* FORM CARD */
        .form-card {
            background: var(--card-bg);
            border-radius: 6px;
            box-shadow: 0 2px 12px rgba(26,37,64,0.09);
            padding: 2rem 2.5rem;
            max-width: 460px;
            margin: 0 auto;
        }

        .form-label {
            color: var(--navy);
            font-size: 0.85rem;
            letter-spacing: 0.06em;
            text-transform: uppercase;
            margin-bottom: 0.3rem;
        }

        .form-control, .form-select {
            border: 1px solid #d4c9b0;
            border-radius: 3px;
            font-size: 0.93rem;
        }

        .form-control:focus, .form-select:focus {
            border-color: var(--gold);
            box-shadow: 0 0 0 0.15rem rgba(201,168,76,0.25);
        }

        .overtime-group {
            display: flex;
            gap: 0.4rem;
            align-items: center;
            margin-top: 0.35rem;
        }

        .overtime-group input[type="number"] {
            width: 90px;
            font-size: 0.85rem;
            padding: 0.28rem 0.5rem;
            border: 1px solid #d4c9b0;
            border-radius: 3px;
        }

        .table-top-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 1rem;
        }

        /* FOOTER */
        .footer-shemu {
            background-color: var(--navy);
            border-top: 2px solid var(--gold);
            color: #8896b0;
            text-align: center;
            padding: 0.7rem;
            font-size: 0.8rem;
            letter-spacing: 0.08em;
        }

        .footer-shemu .year { color: var(--gold); }
    </style>
</head>
<body>

<!-- NAVBAR -->
<nav class="navbar-shemu d-flex align-items-center justify-content-between">
    <a class="navbar-brand-shemu" href="{% url 'employees' %}">
        SHEMU
        <small>PAYROLL SYSTEM</small>
    </a>
    <div class="d-flex gap-1">
        <a href="{% url 'employees' %}"
           class="nav-link-shemu {% if request.resolver_match.url_name == 'employees' or request.resolver_match.url_name == 'create_employee' or request.resolver_match.url_name == 'update_employee' %}active{% endif %}">
            Employees
        </a>
        <a href="{% url 'payslips' %}"
           class="nav-link-shemu {% if request.resolver_match.url_name == 'payslips' or request.resolver_match.url_name == 'view_payslip' %}active{% endif %}">
            Payslips
        </a>
    </div>
</nav>

<!-- PAGE CONTENT -->
<div class="main-content container-fluid">
    {% block content %}
    {% endblock %}
</div>

<!-- FOOTER -->
<footer class="footer-shemu">
    &copy; <span class="year">2026</span> &nbsp;&middot;&nbsp; Shemu Payroll System
</footer>

<script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
</body>
</html>
