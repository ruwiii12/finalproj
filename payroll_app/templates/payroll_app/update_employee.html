{% extends 'base.html' %}

{% block content %}
<div class="form-card">
    <h2 class="page-title" style="font-size:1.5rem;">Update Employee</h2>

    <form method="POST">
        {% csrf_token %}

        <div class="mb-3">
            <label class="form-label">Name</label>
            <input type="text" name="name" class="form-control" value="{{ employee.getName }}" required>
        </div>

        <div class="mb-3">
            <label class="form-label">ID Number</label>
            <input type="text" name="id_number" class="form-control" value="{{ employee.getID }}" readonly required>
        </div>

        <div class="mb-3">
            <label class="form-label">Rate</label>
            <input type="number" name="rate" class="form-control" step="0.01" min="0" value="{{ employee.getRate }}" required>
        </div>

        <div class="mb-4">
            <label class="form-label">Allowance <span style="color:#999; font-size:0.8rem;">(Optional)</span></label>
            <input type="number" name="allowance" class="form-control" step="0.01" min="0"
                   value="{{ employee.getAllowance|default_if_none:'' }}">
        </div>

        <button type="submit" class="btn-shemu-gold w-100" style="padding: 0.55rem;">Save Changes</button>
    </form>
</div>
{% endblock %}
